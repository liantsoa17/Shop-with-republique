<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title, description and OG tags are rewritten by js/product.js on load. -->
    <title>Product — Shop Republic</title>
    <meta name="description" content="A piece from the Shop Republic collection. Browse details, sizes and colours, and order on WhatsApp.">

    <meta property="og:type" content="product">
    <meta property="og:site_name" content="Shop Republic">
    <meta property="og:title" content="Product — Shop Republic">
    <meta property="og:description" content="A piece from the Shop Republic collection.">
    <meta property="og:url" content="">
    <meta property="og:image" content="img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <nav class="solid">
        <div class="nav-left">
            <a href="products.html?category=men">Men</a>
            <a href="products.html?category=ladies">Ladies</a>
            <a href="index.html#about">About Us</a>
        </div>
        <a href="index.html" class="logo">
            <img src="img/logo/logo-light.png" alt="Shop Republic" width="640" height="478">
        </a>
        <div class="nav-right">
            <a href="products.html" class="cart-btn">Shop all</a>
        </div>
    </nav>

    <main id="main">
        <div id="product-root"></div>

        <noscript>
            <div class="state">
                <h2>JavaScript is switched off</h2>
                <p>Product details are loaded from a data file, so this page needs JavaScript.
                   Please enable it, or <a href="products.html">browse the collection</a>.</p>
            </div>
        </noscript>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Shop</h3>
                <ul>
                    <li><a href="products.html">All</a></li>
                    <li><a href="products.html?category=men">Men</a></li>
                    <li><a href="products.html?category=ladies">Ladies</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Men</h3>
                <ul>
                    <li><a href="products.html?category=men&amp;sub=striped-polo">Striped polos</a></li>
                    <li><a href="products.html?category=men&amp;sub=short-sleeve">Short sleeve</a></li>
                    <li><a href="products.html?category=men&amp;sub=zip-polo">Zip polos</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <a href="index.html" class="footer-logo">
                    <img src="img/logo/logo-light.png" alt="Shop Republic" width="640" height="478">
                </a>
                <div class="newsletter">
                    <p>Menswear and ladieswear, selected piece by piece.<br>
                       Message us on WhatsApp to order.</p>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; <span data-year>2026</span> Shop Republic. All rights reserved.</p>
        </div>
    </footer>

    <!-- shop data: plain scripts so the site also works offline from disk -->
    <script src="data/products.js"></script>
    <script src="js/site.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
